#aluminion_annot.yml
name: aluminion_annot
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.8
  - pandas
  - numpy
  - openpyxl
  - matplotlib
  - biopython
  - bcbio-gff
  - gambit
  - bakta
  - prokka         # Lightweight CDS annotation of integron cassettes (integron_parser.py);
                   # kept alongside bakta because base env proves they co-solve. Bakta is
                   # overkill (large DB, slow per tiny cassette) for this micro-annotation step.
  - abricate
  - mlst
  - blast
  - datamash
  - skani          # ANI-based plasmid matching for the MGE alert system (mge_alerts.py)
